{# Ô "Tải Bilibili" (05/11/2026): mức video khi tải link Bilibili qua app Bili23.
   Dùng chung cho khối Nguồn (_form_script.html) và trang Nhận diện (_form_batch.html),
   đặt cạnh Model + Tốc độ; lưu vào khoá bili_quality của taogiong_pipeline.json.
   Danh sách mức khớp gui.BILI_QUALITIES. Cần: pipe. #}
<label class="field"
       title="Mức video khi tải link Bilibili qua app Bili23. Kênh audio chỉ cần TIẾNG để nhận diện nên 360P là đủ — tải nhanh, nhẹ đĩa. Bản thấp lưu riêng thành Downloads\&lt;mã BV&gt;_360P.mp4 (bản đầy đủ vẫn là &lt;mã BV&gt;.mp4). Đang bật 🎞 “Lấy video tải xuống làm video nguồn” thì vẫn tải bản cao nhất để hình không mờ.">
  <span>Tải Bilibili</span>
  <select name="bili_quality">
    {% for q, ten in [("auto", "Cao nhất"), ("1080P", "1080P"), ("720P", "720P"),
                      ("480P", "480P"), ("360P", "360P (chỉ cần tiếng)")] %}
      <option value="{{ q }}" {{ 'selected' if (pipe.bili_quality or 'auto') == q }}>{{ ten }}</option>
    {% endfor %}
  </select>
</label>

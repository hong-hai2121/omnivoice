{% extends "base.html" %}
{% block title %}🫥 Vùng che sub gốc — myvideo{% endblock %}

{# Trang sửa VÙNG CHE SUB GỐC bằng mắt — thay cho việc mở <video>_vungsub.json
   đoán số pixel. Ảnh là khung hình THẬT của video (nguyên cỡ, chỉ thu nhỏ khi
   hiển thị nên toạ độ quy đổi thẳng); dải màu là vùng bước ④ sẽ LÀM MỜ suốt
   video khi ô "Che mờ sub gốc" bật. Kéo hai mép hoặc gõ số → 💾 Lưu. #}
{% block content %}
<div class="pagehead">
  <h1><span class="ico">🫥</span> Vùng che sub gốc</h1>
  <p class="muted"><b>{{ base }}</b> — khung {{ w }}×{{ h }}px.
    Kéo hai mép dải (hoặc kéo cả dải, hoặc gõ số) rồi bấm 💾 Lưu;
    bước ④ sẽ làm mờ đúng dải này khi ô “Che mờ sub gốc” bật.</p>
</div>

<div class="panel">
  <div class="phead">
    <b>Khung hình xem thử</b>
    <span class="phead-gap"></span>
    {# Đổi mốc thời gian để soi khung khác — sub có đoạn ẩn đoạn hiện. #}
    {% for p in [10, 30, 50, 70, 90] %}
      <button type="button" class="small moc" data-t="{{ (dur * p / 100) | round(1) }}">{{ p }}%</button>
    {% endfor %}
  </div>
  <div class="vsbox" id="vsBox">
    <img id="vsAnh" src="/vungsub/khung?base={{ base | urlencode }}" alt="khung hình">
    <div class="vsdai" id="vsDai" title="Kéo cả dải để dời; kéo mép để nới">
      <div class="vsgrip vsgrip-tren" title="Kéo mép TRÊN"></div>
      <div class="vsgrip vsgrip-duoi" title="Kéo mép DƯỚI"></div>
    </div>
  </div>
  <div class="actions">
    <label class="field" style="flex-direction:row; align-items:center; gap:6px">
      <span class="hint" style="margin:0">Mép trên y0</span>
      <input id="vsY0" type="number" min="0" max="{{ h }}" value="{{ y0 }}" style="width:90px">
    </label>
    <label class="field" style="flex-direction:row; align-items:center; gap:6px">
      <span class="hint" style="margin:0">Mép dưới y1</span>
      <input id="vsY1" type="number" min="0" max="{{ h }}" value="{{ y1 }}" style="width:90px">
    </label>
    <span class="hint" id="vsDay"></span>
    <span class="spacer"></span>
    <button type="button" class="small" id="vsDo"
            title="Chạy lại bộ dò tự động (10 khung hình, chờ vài giây) — chỉ xem thử, ưng thì bấm Lưu">🔎 Tự dò lại</button>
    <button type="button" class="small danger" id="vsXoa"
            title="Bỏ vùng đã lưu — lượt dựng sau sẽ tự dò lại từ đầu">🗑 Bỏ vùng đã lưu</button>
    <button type="button" class="primary" id="vsLuu">💾 Lưu vùng che</button>
    <span id="vsNote" class="luunote"></span>
  </div>
  <p class="hint">{% if co_vung %}Đang có vùng ĐÃ LƯU (dải màu là số trong file) —
    sửa xong nhớ bấm Lưu.{% else %}Video này CHƯA có vùng lưu sẵn — dải đang hiện
    chỉ là gợi ý chỗ sub hay nằm; không bấm Lưu thì lượt dựng vẫn tự dò như cũ.{% endif %}
    Sub kiểu video truyện hay nằm NGAY GIỮA khung — bấm các nút % ở trên để soi
    nhiều đoạn trước khi chốt.</p>
  <div class="actions">
    <a class="ghost small" href="/">← Về trang chính</a>
  </div>
</div>

<script>
  (() => {
    const H = {{ h }};
    const box = document.getElementById("vsBox");
    const anh = document.getElementById("vsAnh");
    const dai = document.getElementById("vsDai");
    const iy0 = document.getElementById("vsY0");
    const iy1 = document.getElementById("vsY1");
    const day = document.getElementById("vsDay");
    const note = document.getElementById("vsNote");
    const BASE = {{ base | tojson }};

    let y0 = {{ y0 }}, y1 = {{ y1 }};

    const ve = () => {
      dai.style.top = (100 * y0 / H) + "%";
      dai.style.height = (100 * (y1 - y0) / H) + "%";
      iy0.value = Math.round(y0);
      iy1.value = Math.round(y1);
      day.textContent = "dày " + Math.round(y1 - y0) + "px / cao " + H + "px";
    };
    const dat = (a, b) => {
      y0 = Math.max(0, Math.min(H, a));
      y1 = Math.max(0, Math.min(H, b));
      if (y1 < y0) [y0, y1] = [y1, y0];
      ve();
    };
    iy0.addEventListener("change", () => dat(+iy0.value, y1));
    iy1.addEventListener("change", () => dat(y0, +iy1.value));

    // ── Kéo bằng chuột: mép trên / mép dưới / cả dải ─────────────────────────
    // Toạ độ chuột → pixel video: ảnh hiển thị thu nhỏ nên nhân H/chiều-cao-ảnh.
    let keo = null;                       // "tren" | "duoi" | "dai"
    let goc = 0, gy0 = 0, gy1 = 0;
    const toPx = (e) => (e.clientY - anh.getBoundingClientRect().top)
                        * H / anh.clientHeight;
    dai.addEventListener("pointerdown", (e) => {
      keo = e.target.classList.contains("vsgrip-tren") ? "tren"
          : e.target.classList.contains("vsgrip-duoi") ? "duoi" : "dai";
      goc = toPx(e); gy0 = y0; gy1 = y1;
      dai.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    dai.addEventListener("pointermove", (e) => {
      if (!keo) return;
      const d = toPx(e) - goc;
      if (keo === "tren") dat(gy0 + d, gy1);
      else if (keo === "duoi") dat(gy0, gy1 + d);
      else dat(gy0 + d, gy1 + d);
    });
    dai.addEventListener("pointerup", () => { keo = null; });
    // Bấm thẳng vào ảnh: đặt mép GẦN chỗ bấm hơn nhảy tới đó — chỉnh nhanh.
    box.addEventListener("pointerdown", (e) => {
      if (e.target !== anh) return;
      const p = toPx(e);
      (Math.abs(p - y0) <= Math.abs(p - y1)) ? dat(p, y1) : dat(y0, p);
    });

    const bao = (msg, ok) => {
      note.textContent = msg;
      note.style.color = ok ? "var(--ok)" : "var(--danger)";
      setTimeout(() => { note.textContent = ""; }, 4000);
    };
    const goi = async (url, body) => {
      const r = await fetch(url, { method: "POST", body,
                                   credentials: "same-origin" });
      return { ok: r.ok, d: await r.json().catch(() => ({})) };
    };
    const formData = (extra) => {
      const f = new FormData();
      f.set("base", BASE);
      for (const k in (extra || {})) f.set(k, extra[k]);
      return f;
    };

    document.getElementById("vsLuu").addEventListener("click", async () => {
      const { ok, d } = await goi("/vungsub/luu",
        formData({ y0: Math.round(y0), y1: Math.round(y1) }));
      bao(ok ? "✓ đã lưu vùng che" : "⚠️ " + (d.error || "lưu lỗi"), ok);
    });
    document.getElementById("vsXoa").addEventListener("click", async () => {
      if (!confirm("Bỏ vùng đã lưu? Lượt dựng sau sẽ tự dò lại từ đầu.")) return;
      const { ok } = await goi("/vungsub/xoa", formData());
      bao(ok ? "✓ đã bỏ — sẽ tự dò lại" : "⚠️ không xoá được", ok);
    });
    document.getElementById("vsDo").addEventListener("click", async (e) => {
      e.target.disabled = true;
      e.target.textContent = "🔎 đang dò…";
      try {
        const { ok, d } = await goi("/vungsub/dola", formData());
        if (ok && d.y0 !== undefined) { dat(d.y0, d.y1); bao("✓ dò xong — ưng thì bấm Lưu", true); }
        else bao(d.none ? "không thấy dải sub nào" : "⚠️ " + (d.error || "dò lỗi"), false);
      } finally {
        e.target.disabled = false;
        e.target.textContent = "🔎 Tự dò lại";
      }
    });
    // Nút đổi mốc khung hình xem thử.
    document.querySelectorAll(".moc").forEach(b => b.addEventListener("click", () => {
      anh.style.opacity = ".4";
      anh.onload = () => { anh.style.opacity = "1"; };
      anh.src = "/vungsub/khung?base=" + encodeURIComponent(BASE) + "&t=" + b.dataset.t;
    }));

    ve();
  })();
</script>
{% endblock %}
